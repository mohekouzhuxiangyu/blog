name: Build & Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Sync built files to Gitee pages branch
      - name: Deploy to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'blog' }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not configured, skipping Gitee sync"
            exit 0
          fi
          cd out
          git init -b pages
          git config user.name "bot"
          git config user.email "bot@localhost"
          git add -A
          git commit -m "deploy $(date)"
          git remote add origin https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git
          git push origin pages --force
          echo "Gitee sync done"
