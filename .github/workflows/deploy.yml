name: Deploy to GitHub Pages & Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploy to GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # Deploy to Gitee Pages (only if GITEE_TOKEN is configured)
      - name: Deploy to Gitee Pages
        if: secrets.GITEE_TOKEN != ''
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'blog' }}
        run: |
          cd out
          git init -b pages
          git config user.name "bot"
          git config user.email "bot@localhost"
          git add -A
          git commit -m "deploy $(date)"
          git remote add origin https://${{ secrets.GITEE_USER }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USER }}/${{ secrets.GITEE_REPO || 'blog' }}.git
          git push origin pages --force
        shell: bash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
